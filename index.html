  <style>

    .stage-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(240px,.8fr);gap:20px;align-items:start;margin-top:23px}.image-wrap{background:#fff;border:1px solid #c5d6e8;padding:8px;border-radius:16px;box-shadow:var(--shadow)}.stage{position:relative;line-height:0;user-select:none;touch-action:manipulation;overflow:hidden;border-radius:10px;background:#d8e0e8;width:100%}.stage.tap{cursor:crosshair}.stage img{width:100%;height:auto;display:block;pointer-events:none}.marker{position:absolute;display:grid;place-items:center;transform:translate(-50%,-50%);border-radius:50%;width:clamp(26px,3.6vw,42px);height:clamp(26px,3.6vw,42px);border:3px solid white;background:#076fc8;box-shadow:0 2px 11px #061b3888;color:#fff;font-size:15px;font-weight:800;line-height:1;z-index:2;padding:0}.marker.pick{cursor:pointer}.marker.good{background:var(--green)}.marker.missed{background:var(--red)}.marker.wrong{background:var(--amber)}.marker.hint{background:#e04c24}.marker.tiny{width:26px;height:26px;font-size:12px}.stage-caption{color:#678198;font-size:12px;line-height:1.4;padding:10px 3px 2px}.right-panel{display:flex;flex-direction:column;gap:11px}.status-card{border-radius:13px;background:linear-gradient(135deg,#07549d,#072f5c);color:#fff;padding:19px 20px;display:flex;flex-direction:column;gap:7px}.status-number{font-size:33px;font-weight:850}.status-card small{opacity:.85}.panel{padding:16px;border:1.5px solid #c1d7eb;border-radius:12px;background:#f6faff}.panel h3{color:var(--navy);font-size:19px;margin:0 0 10px}.panel p{font-size:15px;line-height:1.5;margin:6px 0;color:#3d5871}.stat-info{border:1px solid #bdd1e9;border-radius:11px;padding:13px 16px;background:#eaf2fa;font-weight:700;color:var(--navy)}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.toolbar .left,.toolbar .right{display:flex;gap:10px;flex-wrap:wrap}.label-muted{font-size:13px;color:var(--muted)}.pill-label{display:inline-block;border:1px solid #a8cce9;border-radius:999px;padding:5px 11px;background:#eff7ff;color:#184777;font-size:12px;font-weight:750}.progress{height:9px;border-radius:20px;background:#dce7f1;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:linear-gradient(90deg,#0c78c6,#12b0d8);border-radius:20px;transition:width .2s}.helper{padding:12px 15px;background:#fff9eb;border:1px solid #f0d498;border-radius:10px;color:#79511a;font-size:13px;line-height:1.45}.scored{background:#e7f6ee;color:#116d3c;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;white-space:nowrap}.score-banner{display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(140deg,#084882,#0b3364);color:#fff;border-radius:14px;padding:22px 10px;margin-top:24px;gap:6px}.score-banner>div{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;border-right:1px solid #95b4d1}.score-banner>div:last-child{border:none}.score-banner strong{font-size:clamp(27px,4.5vw,50px)}.score-banner span{font-size:clamp(12px,1.4vw,16px);font-weight:650}.results-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:18px}.result-rows{display:flex;flex-direction:column;gap:12px}.result-row{display:flex;gap:15px;border:1px solid #c2d6e7;border-radius:12px;background:#fff;padding:9px;align-items:center;text-align:left;width:100%}.result-row img{width:130px;height:92px;object-fit:cover;border-radius:8px}.result-row .name{flex:1;font-weight:800;color:var(--navy);font-size:17px}.result-row .name small{font-weight:500;display:block;color:#596e80;font-size:13px;margin-top:3px}.miss-list{margin:0;padding-left:20px;font-size:15px;line-height:1.5}.miss-list li{padding:8px 0;border-bottom:1px solid #e1e9f0}.miss-list li:last-child{border:none}.miss-list small{display:block;color:#647b90;font-size:12px;margin-top:2px}.review-title{font-size:20px;font-weight:800;color:var(--navy);margin:5px 0 14px}.review-list{display:grid;gap:10px;margin-top:13px}.review-item{border:1px solid #d9e3ed;border-radius:12px;padding:13px 15px;background:white;display:flex;gap:12px}.review-item .dot{border-radius:50%;width:25px;height:25px;flex-shrink:0;background:var(--red);color:white;display:grid;place-items:center;font-weight:800;font-size:13px}.review-item.found .dot{background:var(--green)}.review-item p{margin:3px 0;color:#516a80;font-size:13px;line-height:1.45}.review-item strong{font-size:14px}.back-home{margin-top:20px}.footer{position:relative;color:#8393a3;text-align:center;font-size:11px;padding:12px;border-top:1px solid #e5eef5}
    .modal{position:fixed;z-index:30;inset:0;background:#061528df;display:flex;flex-direction:column;padding:10px;gap:10px}.modal-top{color:white;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:1400px;width:100%;margin:auto auto 0}.modal-top h3{margin:0;font-size:clamp(16px,2vw,22px)}.modal-actions{display:flex;gap:8px;align-items:center}.modal .btn{min-height:40px;padding:8px 11px}.zoom-viewport{flex:1;width:100%;max-width:1400px;margin:0 auto auto;overflow:auto;border:1px solid #456b90;border-radius:12px;background:#142d42;overscroll-behavior:contain;position:relative}.zoom-inner{width:100%;min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}.zoom-inner .stage{flex-shrink:0;border-radius:0}.zoom-viewport .stage{max-width:none}.modal-note{color:#e8f4ff;font-size:13px;text-align:center;padding:0 5px 9px}.sr-only{position:absolute;height:1px;width:1px;clip:rect(0 0 0 0);overflow:hidden;white-space:nowrap}
    @media(max-width:900px){.bar{height:auto;min-height:67px;padding:10px 15px}.brand{font-size:12px;gap:8px}.brand svg{width:34px;height:34px}.brand div{padding-left:9px}.container{padding:18px 16px 30px}.zone-card img{height:clamp(150px,24vw,260px)}.zone-caption{font-size:14px;min-height:75px;padding:10px;gap:6px}.zone-caption .glyph{width:23px;height:23px}.stage-grid{grid-template-columns:minmax(0,1.5fr) minmax(200px,.8fr);gap:12px}.status-card{padding:14px}.results-grid{gap:10px}.result-row img{width:90px;height:74px}}
    @media(max-width:700px){.bar{background:linear-gradient(105deg,#0a417c 0%,#0a417c 45%,#f1f5fa 45.1%,#f1f5fa 100%)}.lang-switch{gap:4px}.lang-switch button{min-width:36px;padding:7px 7px;font-size:11px}.hero-icon svg{display:none}.zone-cards{grid-template-columns:1fr}.zone-card img{height:175px;object-position:center 42%}.zone-caption{min-height:53px}.stage-grid,.results-grid{grid-template-columns:1fr}.right-panel{display:grid;grid-template-columns:1fr 1fr;align-items:start}.panel{padding:13px}.status-number{font-size:25px}.toolbar{gap:8px}.toolbar .left,.toolbar .right{width:100%;justify-content:space-between}.toolbar .btn{flex:1}.score-banner{padding:13px 5px}.result-row img{width:100px;height:74px}.modal-top{align-items:flex-start}.modal-actions{width:100%}.modal-actions .btn{flex:1}.zoom-inner{align-items:flex-start;justify-content:flex-start}.hero h1{font-size:27px}}
    @media(max-width:400px){.brand{font-size:10px}.brand svg{width:27px;height:27px}.lang-switch button{min-width:33px;padding:5px}.container{padding:13px 11px 22px}.right-panel{grid-template-columns:1fr}.btn{font-size:13px;padding:9px}.result-row .name{font-size:14px}.result-row img{width:76px;height:64px}}
    @media(min-width:1000px) and (max-height:780px){.container{padding-top:12px}.hero{margin-bottom:9px}.hero h1{font-size:30px;margin:2px 0}.hero p{font-size:16px}.accent{margin:7px auto 0}.zone-cards{margin-top:14px}.zone-card img{height:min(39vh,320px)}.actions{margin-top:16px}.stage-grid{margin-top:12px}}
  
/* V4.1 — Tolérance de détection inchangée, surfaces invisibles dans le corrigé.
   Repères compacts : vert=trouvé, rouge=oublié, orangé=hors anomalie. */
.marker.repeat{background:#617d91}
.stage .marker{z-index:3}
.stage .marker.good,.stage .marker.missed,.stage .marker.wrong,.stage .marker.repeat{
 width:clamp(25px,2.5vw,32px);height:clamp(25px,2.5vw,32px);
 border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.22);font-size:14px
}
.stage .marker.tiny{width:25px;height:25px;font-size:12px}
/* Casquette et oreille : les petits repères ne masquent pas les zones proches. */
.stage[data-stage="2"].tap .marker.pick{pointer-events:none}

    /* V4.6 : parcours continu, accès direct aux trois zones sans exposer les réponses. */
    .zone-nav{display:flex;justify-content:center;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
    .zone-step{display:flex;align-items:center;gap:8px;border:1.5px solid #adc9e0;background:#fff;color:#174976;border-radius:12px;padding:9px 15px;min-height:46px;font-weight:750;box-shadow:0 2px 5px #14334c0b}
    .zone-step.current{background:#0a417c;border-color:#0a417c;color:#fff}
    .step-number{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:#eaf2f9;color:#164e7e;font-weight:850}
    .zone-step.current .step-number{background:#fff;color:#0a417c}
    .step-done{font-size:15px;color:#18804e}.zone-step.current .step-done{color:#b8f0d3}
    .finish-note{border:1px solid #d6b56f;background:#fff8e8;border-radius:10px;color:#704b0e;margin-top:12px;padding:9px 12px;font-size:13px}
    @media(max-width:700px){.zone-nav{gap:6px}.zone-step{padding:8px 10px;min-height:44px;font-size:12px;gap:5px}.step-number{width:22px;height:22px}}

    /* V4.7 : identification et historique local pour démonstration, sans serveur */
    .identity-card,.history-card{max-width:960px;margin:18px auto;background:#fff;border:1px solid #ccdfeb;border-radius:18px;box-shadow:var(--shadow);padding:clamp(16px,3vw,30px)}
    .identity-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}
    .identity-head h3{margin:0;color:var(--navy);font-size:21px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 18px}
    .field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:15px;font-weight:750;color:#294963}.field input{width:100%;padding:13px 14px;min-height:49px;border-radius:10px;border:1.5px solid #aac3d8;font:inherit;font-size:16px;color:#172c3e;background:white}.field input:focus{outline:3px solid #9bd0ff;outline-offset:1px;border-color:#0e75bd}.field small,.data-note{font-size:13px;color:#526e86;line-height:1.5}
    .identity-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.identity-foot .btn{min-width:180px}
    .identity-sample{color:#1f6696;background:#e9f5ff;border:1px solid #b5d7ec;padding:9px 11px;border-radius:10px;font-size:13px}
    .record-strip{border:1px solid #c8dce8;background:#eef6fc;border-radius:12px;margin:15px auto 0;padding:13px 16px;max-width:1040px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
    .record-strip strong{color:var(--navy)}.record-strip small{color:#506c81}
    .history-table-wrap{overflow-x:auto;max-width:100%;border:1px solid #d6e2ed;border-radius:12px;background:white;margin-top:14px}
    .history-table{width:100%;border-collapse:collapse;min-width:680px;font-size:14px}.history-table th{background:#e8f1fa;text-align:left;color:#204564;font-size:13px}.history-table th,.history-table td{padding:13px 11px;border-bottom:1px solid #dfebf3;vertical-align:top}.history-table tr:last-child td{border:0}.history-table td strong{color:var(--navy)}
    .history-controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.history-empty{text-align:center;padding:30px 15px;color:#607f94}
    .local-message{border:1px solid #b6dbc8;background:#edf8f2;color:#145d3b;padding:10px 13px;border-radius:10px;font-size:13px;margin-top:12px}
    .local-message.warning{border-color:#e2c28e;background:#fff6e6;color:#76521b}
    @media(max-width:640px){.form-grid{grid-template-columns:1fr}.identity-foot .btn{flex:1}.record-strip{gap:8px}.history-controls .btn{font-size:13px}}

    /* V4.8 : historique visuel et fiche imprimable. Les surfaces de détection ne changent pas. */
    .history-table button.open-record{font-size:13px;color:#07549f;font-weight:800;border:1px solid #9bc2e5;background:white;border-radius:8px;padding:9px;min-height:40px;white-space:nowrap}
    .archive-summary{background:#f0f6fd;border:1px solid #c5dcf0;border-radius:14px;padding:17px;display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0 15px}
    .archive-summary h3{margin:0 0 5px;color:#08294f;font-size:20px}.archive-summary p{margin:3px 0;color:#4e657c;font-size:13px}
    .archive-score{background:#083b73;color:#fff;border-radius:12px;text-align:center;padding:10px 24px;min-width:135px}
    .archive-score strong{display:block;font-size:29px}.archive-score small{font-size:12px}
    .archive-zone{background:#fff;border:1px solid #c5d6e8;border-radius:13px;overflow:hidden;margin:18px 0;box-shadow:var(--shadow)}
    .archive-zone-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 16px;background:#eaf2fb;color:#092f58}
    .archive-zone-head h3{margin:0;font-size:18px}.archive-zone-head strong{white-space:nowrap;font-size:20px}
    .archive-zone-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,.7fr);gap:15px;padding:13px}
    .archive-stage{position:relative;line-height:0;overflow:hidden;background:#dae4ec;border-radius:10px;align-self:start}
    .archive-stage img{display:block;width:100%;height:auto}
    .archive-stage .arch-marker{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;background:#17834d;border:2px solid white;color:#fff;border-radius:50%;width:29px;height:29px;font-size:16px;font-weight:900;line-height:1;box-shadow:0 1px 5px #041b2e8a;z-index:1}
    .archive-stage .arch-marker.miss{background:#cc3340}.archive-stage .arch-marker.bad{background:#be7014}
    .archive-risk{border:1px solid #dae4ed;border-radius:9px;padding:9px 11px;margin-bottom:8px;background:#fff;display:flex;align-items:flex-start;gap:9px;line-height:1.3}
    .archive-risk .riskmark{background:#17834d;border-radius:50%;color:#fff;width:23px;height:23px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
    .archive-risk.miss .riskmark{background:#cc3340}
    .archive-risk b{font-size:13px;color:#143757}.archive-risk p{font-size:12px;color:#657587;margin:4px 0 0;line-height:1.45}
    .archive-legend{font-size:12px;color:#516a80;margin:8px 2px;line-height:1.5}
    .archive-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}
    .print-report{display:none}
    @media(max-width:720px){.archive-zone-inner{grid-template-columns:1fr}.archive-summary{align-items:stretch}.archive-score{flex:1}.history-table button.open-record{font-size:12px;padding:8px}}
    @page{size:A4 portrait;margin:10mm}
    @media print{
      html,body{background:white!important;margin:0!important;padding:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body>.app,#app,.modal{display:none!important}
      .print-report{display:block!important;color:#16334b;font-family:Arial,sans-serif;font-size:10pt;line-height:1.3}
      .print-page{page-break-after:always;break-after:page;min-height:250mm;box-sizing:border-box}
      .print-page:last-child{page-break-after:auto;break-after:auto}
      .print-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid #0a417c;padding-bottom:5mm;margin-bottom:5mm;color:#0a376c}
      .print-head h1{font-size:17pt;line-height:1.15;margin:0}.print-head p{font-size:9pt;color:#526a7e;margin:3px 0 0}
      .print-pill{background:#0a417c;color:white;padding:2mm 4mm;border-radius:2mm;font-weight:bold}
      .print-profile{background:#edf4fa;border:1px solid #b8d1e5;border-radius:2mm;padding:4mm 5mm;margin-bottom:4mm;font-size:10pt}

/* V4-Z1 : cinq anomalies validées, surfaces tolérantes sur la zone 1. */
function distSegment(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const denom=dx*dx+dy*dy;const u=denom?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/denom)):0;return Math.hypot(px-(ax+u*dx),py-(ay+u*dy))}
function inPolygon(x,y,pts){let inside=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside}return inside}
function insideShape(s,x,y){if(s.kind==='rect'){const [a,b,c,d]=s.v;return x>=a&&x<=c&&y>=b&&y<=d}if(s.kind==='ellipse'){const [cx,cy,rx,ry]=s.v;return ((x-cx)/rx)**2+((y-cy)/ry)**2<=1}if(s.kind==='poly')return inPolygon(x,y,s.v);if(s.kind==='path')return s.v.some((p,i)=>i&&distSegment(x,y,...s.v[i-1],...p)<=s.r);return false}
function matchesHazard(h,x,y){return h.shapes.some(s=>insideShape(s,x,y))}
function indexForTap(z,p){const hits=hazards[z].map((h,j)=>matchesHazard(h,p.x,p.y)?j:-1).filter(j=>j>=0);if(!hits.length)return -1;return hits.reduce((a,b)=>Math.hypot(p.x-hazards[z][a].x,p.y-hazards[z][a].y)<=Math.hypot(p.x-hazards[z][b].x,p.y-hazards[z][b].y)?a:b)}
function evalZoneSelections(z){const matched=new Set(),correct=[],wrong=[],repeat=[];state.pick[z].forEach((p,i)=>{const j=indexForTap(z,p);if(j<0){wrong.push({i,p});return}if(matched.has(j)){repeat.push({i,hot:j,p});return}matched.add(j);correct.push({i,hot:j,p})});return {correct,wrong,repeat,miss:hazards[z].map((h,j)=>({h,j})).filter(o=>!matched.has(o.j))}}
function activeZones(){return [0,1,2]}
function allResults(){return activeZones().map(z=>({...evalZoneSelections(z),zone:z}))}
function stageFor(z,review=false,small=false){const stats=evalZoneSelections(z);const showAnswers=review;const hit=new Set(stats.correct.map(o=>o.hot));const picks=state.pick[z].map((p,i)=>{let kind='';if(showAnswers){kind=stats.correct.some(o=>o.i===i)?'good':stats.repeat.some(o=>o.i===i)?'repeat':'wrong'}return `<button type="button" class="marker ${kind} ${small?'tiny':''} ${review?'':'pick'}" style="left:${p.x*100}%;top:${p.y*100}%" ${review?'disabled':`data-action="remove-pick" data-zone="${z}" data-index="${i}"`} aria-label="${t('selected')} ${i+1}">${showAnswers?(kind==='good'?'✓':kind==='repeat'?'=':'!'):i+1}</button>`}).join('');const missed=showAnswers?stats.miss.map(({h})=>`<span class="marker missed ${small?'tiny':''}" style="left:${h.x*100}%;top:${h.y*100}%" title="${label(h)}" aria-label="${label(h)}">!</span>`).join(''):'';return `<div class="stage ${review?'':'tap'}" data-stage="${z}" ${review?'':'role="button" tabindex="0"'} aria-label="${t('zone')} ${z+1}"><img draggable="false" alt="${t('zone')} ${z+1} – ${t('zones')[z]}" src="${zones[z].image}">${picks}${missed}</div>`}
function controls(review=false){const seq=activeZones(),pos=seq.indexOf(state.zone),hasPrev=pos>0,hasNext=pos>=0&&pos<seq.length-1,allSeen=state.visited.every(Boolean);return `<div class="toolbar"><div class="left"><button class="btn" data-action="${review?'review-prev':'prev'}" ${hasPrev?'':'disabled'}>${I('back')}${t('previous')}</button><button class="btn" data-action="${review?'review-next':'next'}" ${hasNext?'':'disabled'}>${t('next')}${I('chevron')}</button></div><div class="right">${review?`<button class="btn primary" data-action="results">${I('trophy')}${t('goResult')}</button>`:`<button class="btn minor" data-action="undo" ${state.pick[state.zone].length===0?'disabled':''}>${I('undo')}${t('undo')}</button>${hasNext?'':`<button class="btn primary" data-action="finish" ${allSeen?'':'disabled'} title="${state.lang==='fr'&&!allSeen?'Parcourir les trois zones avant la correction':''}">${I('check')}${t('finish')}</button>`}`}</div></div>${!review&&!hasNext&&!allSeen?`<div class="finish-note" role="status">${state.lang==='fr'?'Visite les trois zones avant de terminer et de voir les corrections.':t('how')}</div>`:''}`}
function zoneNav(){return `<nav class="zone-nav" aria-label="${state.lang==='fr'?'Navigation entre les trois zones':'Zone navigation'}">${zones.map((z,i)=>`<button type="button" data-action="jump-zone" data-zone="${i}" class="zone-step ${i===state.zone?'current':''} ${state.visited[i]?'visited':''}" aria-current="${i===state.zone?'step':'false'}"><span class="step-number">${i+1}</span><span>${t('zone')} ${i+1}</span>${state.visited[i]?'<span class="step-done" aria-hidden="true">✓</span>':''}</button>`).join('')}</nav>`}
function evaluation(){const z=state.zone;const count=state.pick[z].length;return `${title(`${t('zone')} ${z+1} – ${t('zones')[z]}`,t('tap'),'helmet')}${zoneNav()}<div class="stage-grid"><div><div class="image-wrap">${stageFor(z)}<div class="stage-caption">${t('tip')}</div></div>${controls()}</div><aside class="right-panel"><div class="status-card"><small>${t('selected')}</small><div class="status-number">${count}</div><small>${t('note')}</small></div><div class="stat-info">${t('status')} – ${t('zone')} ${z+1} (${z+1} / 3)<div class="progress"><div style="width:${state.visited.filter(Boolean).length/3*100}%"></div></div></div><div class="panel"><h3>${t('status')}</h3><p>${t('zones')[z]}</p><p class="label-muted">${t('how')}</p></div><button class="btn" data-action="zoom">${I('zoom')}${t('zoom')}</button></aside></div><p class="smallnote">${t('demoBanner')}</p>`}
function results(){const rs=allResults(),seq=activeZones(),total=seq.reduce((a,z)=>a+hazards[z].length,0),good=rs.reduce((a,r)=>a+r.correct.length,0),wrong=rs.reduce((a,r)=>a+r.wrong.length,0),pct=Math.round(good/total*100),done=seq.filter(z=>state.visited[z]).length;const missedItems=rs.flatMap(r=>r.miss.map(({h})=>({h,z:r.zone})));return `${title(t('results'),t('subtitle'),'trophy')}${profileStrip()}<div class="score-banner"><div><span>${t('score')}</span><strong>${pct} %</strong></div><div><span>${t('found')}</span><strong>${good} / ${total}</strong></div><div><span>${t('completed')}</span><strong>${done} / ${seq.length}</strong></div></div><div class="results-grid"><div><h3 class="review-title">${t('zoneResults')}</h3><div class="result-rows">${rs.map(r=>`<button class="result-row" data-action="review-zone" data-zone="${r.zone}"><img alt="" src="${zones[r.zone].image}"><span class="name">${t('zone')} ${r.zone+1}<small>${t('zones')[r.zone]}</small></span><span class="scored">${r.correct.length} / ${hazards[r.zone].length}</span></button>`).join('')}</div></div><div><div class="panel"><h3>${I('alert')} ${t('missed')} (${missedItems.length})</h3>${missedItems.length?`<ul class="miss-list">${missedItems.map(o=>`<li><strong>${label(o.h)}</strong><small>${t('zone')} ${o.z+1} – ${t('zones')[o.z]}</small></li>`).join('')}</ul>`:`<p>${t('noMiss')}</p>`}<p><strong>${t('false')} :</strong> ${wrong}${rs.some(r=>r.repeat.length)?` · ${t('duplicate')} : ${rs.reduce((a,r)=>a+r.repeat.length,0)}`:''}</p></div></div></div><div class="actions"><button class="btn big" data-action="review-zone" data-zone="${seq[0]}">${I('eye')}${t('review')}</button><button class="btn big" data-action="history-view" data-id="${esc(state.savedEntryId||'')}">${I('eye')}Revoir la fiche enregistrée</button><button class="btn big" data-action="history">${I('check')}${f('history')}</button><button class="btn primary big" data-action="reset">${I('undo')}${t('retry')}</button></div><div class="local-messag function action(name,element){switch(name){case 'lang':state.lang=element.dataset.lang;localStorage.setItem('dojo-lang',state.lang);render();break;case 'start':beginIdentification('eval',0);break;case 'demo':beginIdentification('demo',0);break;case 'open-zone':beginIdentification('eval',Number(element.dataset.zone));break;case 'go-home':state.page='home';state.profile=null;state.zoom=false;render();window.scrollTo(0,0);break;case 'history':state.page='history';state.historyRecordId=null;state.zoom=false;render();window.scrollTo(0,0);break;case 'history-view':state.historyRecordId=element.dataset.id||state.savedEntryId;if(!getSelectedRecord()){alert('Fiche non disponible');break;}state.page='history-detail';state.zoom=false;render();window.scrollTo(0,0);break;case 'pdf':if(state.page==='history-detail'&&getSelectedRecord()){window.print()}break;case 'export':exportHistory();break;case 'clear-history':if(confirm(f('sure'))){if(writeHistory([])){state.historyError=null;render()}}break;case 'jump-zone':if(state.page==='eval')changeZone(Number(element.dataset.zone));break;case 'prev':changeZone(state.zone-1);break;case 'next':changeZone(state.zone+1);break;case 'undo':state.pick[state.zone].pop();render();break;case 'remove-pick':state.pick[Number(element.dataset.zone)].splice(Number(element.dataset.index),1);render();break;case 'finish':finishAndSave();break;case 'zoom':state.zoom=true;state.zoomValue=1;render();break;case 'zoom-minus':state.zoomValue=Math.max(1,Math.round((state.zoomValue-.25)*100)/100);render();break;case 'zoom-plus':state.zoomValue=Math.min(3,Math.round((state.zoomValue+.25)*100)/100);render();break;case 'zoom-close':state.zoom=false;render();break;case 'results':if(state.page!=='review')break;state.page='results';state.zoom=false;render();window.scrollTo(0,0);break;case 'reset':beginIdentification('eval',0);break;case 'review-zone':if(state.page!=='results')break;state.page='review';changeZone(Number(element.dataset.zone));break;case 'review-next':if(state.page==='review')changeZone(state.zone+1);break;case 'review-prev':if(state.page==='review')changeZone(state.zone-1);break}}
