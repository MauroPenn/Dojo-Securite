const zones=[{image:'zone-1.webp',icon:'tools'},{image:'zone-2.webp',icon:'hook'},{image:'zone-3.webp',icon:'engine'}];
const state={page:'home',lang:localStorage.getItem('dojo-lang')||'fr',zone:0,mode:'eval',pick:[[],[],[]],zoom:false,zoomValue:1,reveal:false};
const langOk=Object.hasOwn(texts,state.lang);if(!langOk)state.lang='fr';
const $=s=>document.querySelector(s);const t=k=>texts[state.lang]?.[k]??texts.fr[k];const label=h=>h.t[state.lang]||h.t.fr;const detail=h=>h.d[state.lang]||h.d.fr;
function header(){const items=[['fr','FR'],['uk','UKR'],['en','EN'],['dr','دری']];return `<header class="bar"><div class="brand">${I('factory')}<div>${t('brand')}</div></div><nav class="lang-switch" aria-label="Langues">${items.map(([id,display])=>`<button type="button" data-action="lang" data-lang="${id}" class="${id===state.lang?'active':''}" aria-pressed="${id===state.lang}">${display}</button>`).join('')}</nav></header>`}
function footer(){return `<footer class="footer">Dojo Sécurité – prototype V1 • 3 zones • aucune donnée personnelle enregistrée</footer>`}
function title(headerTxt,sub,icon='helmet',level=2){return `<div class="hero"><div class="hero-icon">${I(icon)}<h${level}>${headerTxt}</h${level}></div>${sub?`<p>${sub}</p>`:''}<div class="accent"></div></div>`}
function home(){return `${title(t('title'),t('subtitle'),'helmet',1)}<div class="zone-cards">${zones.map((z,i)=>`<button class="zone-card" data-action="open-zone" data-zone="${i}"><img alt="${t('zone')} ${i+1}" src="${z.image}"><div class="zone-caption">${I(z.icon,'glyph')}<span>${t('zone')} ${i+1}<br>${t('zones')[i]}</span><span class="arrow" aria-hidden="true">›</span></div></button>`).join('')}</div><div class="actions"><button class="btn primary big" data-action="start">${I('play')}${t('begin')}</button><button class="btn big" data-action="demo">${I('eye')}${t('demo')}</button></div><div class="info-bar">${I('info')} ${t('how')}</div><p class="smallnote">${t('homeTip')}</p>`}
function evalZoneSelections(z){const matched=new Set(),correct=[],wrong=[];state.pick[z].forEach((p,i)=>{let best=-1,dist=1e9;hazards[z].forEach((h,j)=>{const d=Math.hypot(p.x-h.x,p.y-h.y);if(!matched.has(j)&&d<h.r&&d<dist){best=j;dist=d}});if(best>=0){matched.add(best);correct.push({i,hot:best,p})}else wrong.push({i,p})});return {correct,wrong,miss:hazards[z].map((h,j)=>({h,j})).filter(o=>!matched.has(o.j))}}
function allResults(){return zones.map((_,i)=>evalZoneSelections(i))}
function stageFor(z,review=false,small=false){const stats=evalZoneSelections(z);const picks=state.pick[z].map((p,i)=>{let kind='';if(review||state.reveal&&state.mode==='demo'){kind=stats.correct.some(o=>o.i===i)?'good':'wrong'}return `<button type="button" class="marker ${kind} ${small?'tiny':''} ${review?'':'pick'}" style="left:${p.x*100}%;top:${p.y*100}%" ${review?'disabled':`data-action="remove-pick" data-zone="${z}" data-index="${i}"`} aria-label="${t('selected')} ${i+1}">${review?(kind==='good'?'✓':'!'):i+1}</button>`}).join('');const showAnswers=review||(state.mode==='demo'&&state.reveal);const missed=showAnswers?stats.miss.map(({h,j})=>`<span class="marker missed ${small?'tiny':''}" style="left:${h.x*100}%;top:${h.y*100}%" title="${label(h)}" aria-label="${label(h)}">!</span>`).join(''):'';const demoHints='';return `<div class="stage ${review?'':'tap'}" data-stage="${z}" ${review?'':'role="button" tabindex="0"'} aria-label="${t('zone')} ${z+1}"><img draggable="false" alt="${t('zone')} ${z+1} – ${t('zones')[z]}" src="${zones[z].image}">${picks}${missed}${demoHints}</div>`}
function controls(review=false){return `<div class="toolbar"><div class="left"><button class="btn" data-action="${review?'review-prev':'prev'}" ${state.zone===0?'disabled':''}>${I('back')}${t('previous')}</button><button class="btn" data-action="${review?'review-next':'next'}" ${state.zone>=2?'disabled':''}>${t('next')}${I('chevron')}</button></div><div class="right">${review?`<button class="btn primary" data-action="results">${I('trophy')}${t('goResult')}</button>`:`<button class="btn minor" data-action="undo" ${state.pick[state.zone].length===0?'disabled':''}>${I('undo')}${t('undo')}</button><button class="btn primary" data-action="finish">${I('check')}${t('finish')}</button>`}</div></div>`}
function evaluation(){const z=state.zone;const count=state.pick[z].length;return `${title(`${t('zone')} ${z+1} – ${t('zones')[z]}`,t('tap'),'helmet')}<div class="stage-grid"><div><div class="image-wrap">${stageFor(z)}<div class="stage-caption">${t('tip')}</div></div>${controls()}</div><aside class="right-panel"><div class="status-card"><small>${t('selected')}</small><div class="status-number">${count}</div><small>${t('note')}</small></div><div class="stat-info">${t('zone')} ${z+1} ${t('of')} 3<div class="progress"><div style="width:${((z+1)/3)*100}%"></div></div></div><div class="panel"><h3>${t('status')}</h3><p>${t('zones')[z]}</p><p class="label-muted">${t('how')}</p></div><button class="btn" data-action="zoom">${I('zoom')}${t('zoom')}</button>${state.mode==='demo'?`<button class="btn dark" data-action="reveal">${I('eye')}${state.reveal?t('hide'):t('revealed')}</button><div class="helper">${t('demotip')}</div>`:''}</aside></div><p class="smallnote">${t('demoBanner')}</p>`}
function results(){const rs=allResults(),total=hazards.flat().length,good=rs.reduce((a,r)=>a+r.correct.length,0),wrong=rs.reduce((a,r)=>a+r.wrong.length,0),pct=Math.round(good/total*100);let missedItems=[];rs.forEach((res,z)=>res.miss.forEach(({h})=>missedItems.push({h,z})));return `${title(t('results'),t('subtitle'),'trophy')}<div class="score-banner"><div><span>${t('score')}</span><strong>${pct} %</strong></div><div><span>${t('found')}</span><strong>${good} / ${total}</strong></div><div><span>${t('completed')}</span><strong>3 / 3</strong></div></div><div class="results-grid"><div><h3 class="review-title">${t('zoneResults')}</h3><div class="result-rows">${zones.map((z,i)=>`<button class="result-row" data-action="review-zone" data-zone="${i}"><img alt="" src="${z.image}"><span class="name">${t('zone')} ${i+1}<small>${t('zones')[i]}</small></span><span class="scored">${rs[i].correct.length} / ${hazards[i].length}</span></button>`).join('')}</div></div><div><div class="panel"><h3>${I('alert')} ${t('missed')} (${missedItems.length})</h3>${missedItems.length?`<ul class="miss-list">${missedItems.map(o=>`<li><strong>${label(o.h)}</strong><small>${t('zone')} ${o.z+1} – ${t('zones')[o.z]}</small></li>`).join('')}</ul>`:`<p>${t('noMiss')}</p>`}<p><strong>${t('false')} :</strong> ${wrong}</p></div></div></div><div class="actions"><button class="btn big" data-action="review-zone" data-zone="0">${I('eye')}${t('review')}</button><button class="btn primary big" data-action="reset">${I('undo')}${t('retry')}</button></div><p class="smallnote">${t('demoBanner')}</p>`}
function review(){const z=state.zone,r=evalZoneSelections(z),hit=new Set(r.correct.map(p=>p.hot));return `${title(`${t('zone')} ${z+1} – ${t('zones')[z]}`,t('review'),'eye')}<div class="stage-grid"><div><div class="image-wrap">${stageFor(z,true)}<div class="stage-caption"><span style="color:var(--green)">●</span> ${t('foundLabel')} &nbsp; <span style="color:var(--red)">●</span> ${t('missLabel')} &nbsp; <span style="color:var(--amber)">●</span> ${t('falseLabel')}</div></div>${controls(true)}</div><div><div class="status-card"><small>${t('found')}</small><div class="status-number">${r.correct.length} / ${hazards[z].length}</div><small>${t('false')} : ${r.wrong.length}</small></div><div style="height:12px"></div><button class="btn" data-action="zoom">${I('zoom')}${t('zoom')}</button><div class="review-list">${hazards[z].map((h,i)=>`<div class="review-item ${hit.has(i)?'found':''}"><span class="dot">${hit.has(i)?'✓':'!'}</span><div><strong>${label(h)}</strong><p>${detail(h)}</p></div></div>`).join('')}</div></div></div><div class="actions back-home"><button class="btn" data-action="results">${I('back')}${t('goResult')}</button></div><p class="smallnote">${t('demoBanner')}</p>`}
function zoomModal(){const z=state.zone,review=state.page==='review';return `<div class="modal" role="dialog" aria-modal="true" aria-label="${t('zoom')}"><div class="modal-top"><h3>${t('zone')} ${z+1} – ${t('zones')[z]}</h3><div class="modal-actions"><button class="btn" data-action="zoom-minus" aria-label="-">${I('minus')}</button><span>${Math.round(state.zoomValue*100)} %</span><button class="btn" data-action="zoom-plus" aria-label="+">${I('plus')}</button><button class="btn" data-action="zoom-close">${I('close')}${t('close')}</button></div></div><div class="zoom-viewport" id="zoom-viewport"><div class="zoom-inner"><div style="width:${state.zoomValue*100}%;min-width:${state.zoomValue*100}%;max-width:none">${stageFor(z,review,true)}</div></div></div><div class="modal-note">${t('zoomHelp')}</div></div>`}
function render(){document.documentElement.lang=state.lang==='dr'?'fa-AF':state.lang==='uk'?'uk':state.lang;document.documentElement.dir=state.lang==='dr'?'rtl':'ltr';let root=$('#app');const sy=window.scrollY;root.innerHTML=`<div class="app">${header()}<main class="container">${state.page==='home'?home():state.page==='eval'?evaluation():state.page==='results'?results():review()}</main>${footer()}</div>${state.zoom?zoomModal():''}`;if(state.zoom){document.body.style.overflow='hidden'}else{document.body.style.overflow='';window.scrollTo(0,sy)}}
function changeZone(z){state.zone=Math.max(0,Math.min(2,z));state.reveal=false;state.zoom=false;render();window.scrollTo(0,0)}
function start(mode){state.mode=mode;state.page='eval';state.zone=0;state.pick=[[],[],[]];state.reveal=false;state.zoom=false;render();window.scrollTo(0,0)}
function selectAt(stage,e){if(state.page!=='eval')return;const rect=stage.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;if(x<0||x>1||y<0||y>1)return;let found=state.pick[state.zone].findIndex(p=>Math.hypot(p.x-x,p.y-y)<.045);if(found>=0)state.pick[state.zone].splice(found,1);else state.pick[state.zone].push({x,y});const zoom=state.zoom,zoomV=state.zoomValue;render();if(zoom){state.zoomValue=zoomV}}
function action(name,element){switch(name){case 'lang':state.lang=element.dataset.lang;localStorage.setItem('dojo-lang',state.lang);render();break;case 'start':start('eval');break;case 'demo':start('demo');break;case 'open-zone':start('demo');changeZone(Number(element.dataset.zone));break;case 'prev':changeZone(state.zone-1);break;case 'next':changeZone(state.zone+1);break;case 'undo':state.pick[state.zone].pop();render();break;case 'remove-pick':state.pick[Number(element.dataset.zone)].splice(Number(element.dataset.index),1);render();break;case 'finish':state.page='results';state.reveal=false;render();window.scrollTo(0,0);break;case 'reveal':state.reveal=!state.reveal;render();break;case 'zoom':state.zoom=true;state.zoomValue=1;render();break;case 'zoom-minus':state.zoomValue=Math.max(1,Math.round((state.zoomValue-.25)*100)/100);render();break;case 'zoom-plus':state.zoomValue=Math.min(3,Math.round((state.zoomValue+.25)*100)/100);render();break;case 'zoom-close':state.zoom=false;render();break;case 'results':state.page='results';state.zoom=false;render();window.scrollTo(0,0);break;case 'reset':start('eval');break;case 'review-zone':state.page='review';changeZone(Number(element.dataset.zone));break;case 'review-next':changeZone(state.zone+1);break;case 'review-prev':changeZone(state.zone-1);break}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();action(a.dataset.action,a);return}const s=e.target.closest('.stage.tap');if(s)selectAt(s,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.zoom){state.zoom=false;render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.stage.tap')){e.preventDefault()}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js?v=2').catch(()=>{})}
render();
})();
</script>
</body>
</html>
