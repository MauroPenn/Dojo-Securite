function distSegment(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const denom=dx*dx+dy*dy;const u=denom?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/denom)):0;return Math.hypot(px-(ax+u*dx),py-(ay+u*dy))}
function inPolygon(x,y,pts){let inside=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside}return inside}
function insideShape(s,x,y){if(s.kind==='rect'){const [a,b,c,d]=s.v;return x>=a&&x<=c&&y>=b&&y<=d}if(s.kind==='ellipse'){const [cx,cy,rx,ry]=s.v;return ((x-cx)/rx)**2+((y-cy)/ry)**2<=1}if(s.kind==='poly')return inPolygon(x,y,s.v);if(s.kind==='path')return s.v.some((p,i)=>i&&distSegment(x,y,...s.v[i-1],...p)<=s.r);return false}
function matchesHazard(h,x,y){return h.shapes.some(s=>insideShape(s,x,y))}
function indexForTap(z,p){const hits=hazards[z].map((h,j)=>matchesHazard(h,p.x,p.y)?j:-1).filter(j=>j>=0);if(!hits.length)return -1;return hits.reduce((a,b)=>Math.hypot(p.x-hazards[z][a].x,p.y-hazards[z][a].y)<=Math.hypot(p.x-hazards[z][b].x,p.y-hazards[z][b].y)?a:b)}
function evalZoneSelections(z){const matched=new Set(),correct=[],wrong=[],repeat=[];state.pick[z].forEach((p,i)=>{const j=indexForTap(z,p);if(j<0){wrong.push({i,p});return}if(matched.has(j)){repeat.push({i,hot:j,p});return}matched.add(j);correct.push({i,hot:j,p})});return {correct,wrong,repeat,miss:hazards[z].map((h,j)=>({h,j})).filter(o=>!matched.has(o.j))}}
function allResults(){return [evalZoneSelections(state.testZone)]}
function stageFor(z,review=false,small=false){const stats=evalZoneSelections(z);const showAnswers=review||(state.mode==='demo'&&state.reveal);const hit=new Set(stats.correct.map(o=>o.hot));const picks=state.pick[z].map((p,i)=>{let kind='';if(showAnswers){kind=stats.correct.some(o=>o.i===i)?'good':stats.repeat.some(o=>o.i===i)?'repeat':'wrong'}return `<button type="button" class="marker ${kind} ${small?'tiny':''} ${review?'':'pick'}" style="left:${p.x*100}%;top:${p.y*100}%" ${review?'disabled':`data-action="remove-pick" data-zone="${z}" data-index="${i}"`} aria-label="${t('selected')} ${i+1}">${showAnswers?(kind==='good'?'✓':kind==='repeat'?'=':'!'):i+1}</button>`}).join('');const missed=showAnswers?stats.miss.map(({h})=>`<span class="marker missed ${small?'tiny':''}" style="left:${h.x*100}%;top:${h.y*100}%" title="${label(h)}" aria-label="${label(h)}">!</span>`).join(''):'';return `<div class="stage ${review?'':'tap'}" data-stage="${z}" ${review?'':'role="button" tabindex="0"'} aria-label="${t('zone')} ${z+1}"><img draggable="false" alt="${t('zone')} ${z+1} – ${t('zones')[z]}" src="${zones[z].image}">${picks}${missed}</div>`}
function controls(review=false){return `<div class="toolbar"><div class="left"><button class="btn" data-action="${review?'review-prev':'prev'}" ${'disabled'}>${I('back')}${t('previous')}</button><button class="btn" data-action="${review?'review-next':'next'}" ${'disabled'}>${t('next')}${I('chevron')}</button></div><div class="right">${review?`<button class="btn primary" data-action="results">${I('trophy')}${t('goResult')}</button>`:`<button class="btn minor" data-action="undo" ${state.pick[state.zone].length===0?'disabled':''}>${I('undo')}${t('undo')}</button><button class="btn primary" data-action="finish">${I('check')}${t('finish')}</button>`}</div></div>`}
function evaluation(){const z=state.zone;const count=state.pick[z].length;return `${title(`${t('zone')} ${z+1} – ${t('zones')[z]}`,t('tap'),'helmet')}<div class="stage-grid"><div><div class="image-wrap">${stageFor(z)}<div class="stage-caption">${t('tip')}</div></div>${controls()}</div><aside class="right-panel"><div class="status-card"><small>${t('selected')}</small><div class="status-number">${count}</div><small>${t('note')}</small></div><div class="stat-info">${t('status')} – ${t('zone')} ${z+1}<div class="progress"><div style="width:${((z+1)/3)*100}%"></div></div></div><div class="panel"><h3>${t('status')}</h3><p>${t('zones')[z]}</p><p class="label-muted">${t('how')}</p></div><button class="btn" data-action="zoom">${I('zoom')}${t('zoom')}</button>${state.mode==='demo'?`<button class="btn dark" data-action="reveal">${I('eye')}${state.reveal?t('hide'):t('revealed')}</button><div class="helper">${t('demotip')}</div>`:''}</aside></div><p class="smallnote">${t('demoBanner')}</p>`}
function results(){const rs=allResults(),total=hazards[state.testZone].length,good=rs.reduce((a,r)=>a+r.correct.length,0),wrong=rs.reduce((a,r)=>a+r.wrong.length,0),pct=Math.round(good/total*100);let missedItems=[];rs.forEach((res,z)=>res.miss.forEach(({h})=>missedItems.push({h,z:state.testZone})));return `${title(t('results'),t('subtitle'),'trophy')}<div class="score-banner"><div><span>${t('score')}</span><strong>${pct} %</strong></div><div><span>${t('found')}</span><strong>${good} / ${total}</strong></div><div><span>${t('completed')}</span><strong>${state.visited[state.testZone]?1:0} / 1</strong></div></div><div class="results-grid"><div><h3 class="review-title">${t('zoneResults')}</h3><div class="result-rows">${[state.testZone].map((i)=>`<button class="result-row" data-action="review-zone" data-zone="${i}"><img alt="" src="${zones[i].image}"><span class="name">${t('zone')} ${i+1}<small>${t('zones')[i]}</small></span><span class="scored">${rs[0].correct.length} / ${hazards[i].length}</span></button>`).join('')}</div></div><div><div class="panel"><h3>${I('alert')} ${t('missed')} (${missedItems.length})</h3>${missedItems.length?`<ul class="miss-list">${missedItems.map(o=>`<li><strong>${label(o.h)}</strong><small>${t('zone')} ${o.z+1} – ${t('zones')[o.z]}</small></li>`).join('')}</ul>`:`<p>${t('noMiss')}</p>`}<p><strong>${t('false')} :</strong> ${wrong}${rs.some(r=>r.repeat.length)?` · ${t('duplicate')} : ${rs.reduce((a,r)=>a+r.repeat.length,0)}`:''}</p></div></div></div><div class="actions"><button class="btn big" data-action="review-zone" data-zone="${state.testZone}">${I('eye')}${t('review')}</button><button class="btn primary big" data-action="reset">${I('undo')}${t('retry')}</button></div><p class="smallnote">${t('demoBanner')}</p>`}
function review(){const z=state.zone,r=evalZoneSelections(z),hit=new Set(r.correct.map(p=>p.hot));return `${title(`${t('zone')} ${z+1} – ${t('zones')[z]}`,t('review'),'eye')}<div class="stage-grid"><div><div class="image-wrap">${stageFor(z,true)}<div class="stage-caption"><span style="color:var(--green)">●</span> ${t('foundLabel')} &nbsp; <span style="color:var(--red)">●</span> ${t('missLabel')} &nbsp; <span style="color:var(--amber)">●</span> ${t('falseLabel')}</div></div>${controls(true)}</div><div><div class="status-card"><small>${t('found')}</small><div class="status-number">${r.correct.length} / ${hazards[z].length}</div><small>${t('false')} : ${r.wrong.length}</small></div><div style="height:12px"></div><button class="btn" data-action="zoom">${I('zoom')}${t('zoom')}</button><div class="review-list">${hazards[z].map((h,i)=>`<div class="review-item ${hit.has(i)?'found':''}"><span class="dot">${hit.has(i)?'✓':'!'}</span><div><strong>${label(h)}</strong><p>${detail(h)}</p></div></div>`).join('')}</div></div></div><div class="actions back-home"><button class="btn" data-action="results">${I('back')}${t('goResult')}</button></div><p class="smallnote">${t('demoBanner')}</p>`}
function zoomModal(){const z=state.zone,review=state.page==='review';return `<div class="modal" role="dialog" aria-modal="true" aria-label="${t('zoom')}"><div class="modal-top"><h3>${t('zone')} ${z+1} – ${t('zones')[z]}</h3><div class="modal-actions"><button class="btn" data-action="zoom-minus" aria-label="-">${I('minus')}</button><span>${Math.round(state.zoomValue*100)} %</span><button class="btn" data-action="zoom-plus" aria-label="+">${I('plus')}</button><button class="btn" data-action="zoom-close">${I('close')}${t('close')}</button></div></div><div class="zoom-viewport" id="zoom-viewport"><div class="zoom-inner"><div style="width:${state.zoomValue*100}%;min-width:${state.zoomValue*100}%;max-width:none">${stageFor(z,review,true)}</div></div></div><div class="modal-note">${t('zoomHelp')}</div></div>`}
function render(){document.documentElement.lang=state.lang==='dr'?'fa-AF':state.lang==='uk'?'uk':state.lang;document.documentElement.dir=state.lang==='dr'?'rtl':'ltr';let root=$('#app');const sy=window.scrollY;root.innerHTML=`<div class="app">${header()}<main class="container">${state.page==='home'?home():state.page==='eval'?evaluation():state.page==='results'?results():review()}</main>${footer()}</div>${state.zoom?zoomModal():''}`;if(state.zoom){document.body.style.overflow='hidden'}else{document.body.style.overflow='';window.scrollTo(0,sy)}}
function changeZone(z){state.zone=Math.max(0,Math.min(2,z));state.reveal=false;state.zoom=false;state.visited[state.zone]=true;render();window.scrollTo(0,0)}
function start(mode,z=2){state.mode=mode;state.page='eval';state.zone=z;state.testZone=z;state.pick=[[],[],[]];state.visited=[false,false,false];state.visited[z]=true;state.reveal=false;state.zoom=false;render();window.scrollTo(0,0)}
function selectAt(stage,e){if(state.page!=='eval')return;const rect=stage.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;if(x<0||x>1||y<0||y>1)return;const target=indexForTap(state.zone,{x,y});let found=state.pick[state.zone].findIndex(p=>{
 const prior=indexForTap(state.zone,p);
 return prior===target&&Math.hypot(p.x-x,p.y-y)<.045
});if(found>=0)state.pick[state.zone].splice(found,1);else state.pick[state.zone].push({x,y});const zoom=state.zoom,zoomV=state.zoomValue;render();if(zoom){state.zoomValue=zoomV}}
function action(name,element){switch(name){case 'lang':state.lang=element.dataset.lang;localStorage.setItem('dojo-lang',state.lang);render();break;case 'start':start('eval');break;case 'demo':start('demo');break;case 'open-zone':start('eval',Number(element.dataset.zone));break;case 'prev':changeZone(state.zone-1);break;case 'next':changeZone(state.zone+1);break;case 'undo':state.pick[state.zone].pop();render();break;case 'remove-pick':state.pick[Number(element.dataset.zone)].splice(Number(element.dataset.index),1);render();break;case 'finish':state.page='results';state.reveal=false;render();window.scrollTo(0,0);break;case 'reveal':state.reveal=!state.reveal;render();break;case 'zoom':state.zoom=true;state.zoomValue=1;render();break;case 'zoom-minus':state.zoomValue=Math.max(1,Math.round((state.zoomValue-.25)*100)/100);render();break;case 'zoom-plus':state.zoomValue=Math.min(3,Math.round((state.zoomValue+.25)*100)/100);render();break;case 'zoom-close':state.zoom=false;render();break;case 'results':state.page='results';state.zoom=false;render();window.scrollTo(0,0);break;case 'reset':start('eval',state.testZone);break;case 'review-zone':state.page='review';changeZone(Number(element.dataset.zone));break;case 'review-next':changeZone(state.zone+1);break;case 'review-prev':changeZone(state.zone-1);break}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();action(a.dataset.action,a);return}const s=e.target.closest('.stage.tap');if(s)selectAt(s,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.zoom){state.zoom=false;render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.stage.tap')){e.preventDefault()}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js?v=4-4-zone3').catch(()=>{})}
render();
})();
</script>
</body>
